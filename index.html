<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>㈱Inbalink シフトダッシュボード</title>
  
  <!-- ブラウザタブ用のカレンダーアイコン（ファビコン） -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e11d48' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='4' rx='2' ry='2'/><line x1='16' x2='16' y1='2' y2='6'/><line x1='8' x2='8' y1='2' y2='6'/><line x1='3' x2='21' y1='10' y2='10'/></svg>">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; background-color: #f8fafc; }
    .glass-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); border: 1px solid #f1f5f9; }
    .timeline-bg { background-image: repeating-linear-gradient(to right, transparent, transparent 49px, #e2e8f0 49px, #e2e8f0 50px); background-size: 50px 100%; }
  </style>
</head>
<body class="p-4 md:p-8 text-slate-800">
  
  <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-rose-600 p-2.5 rounded-xl text-white">
        <i data-lucide="calendar-days" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
          ㈱Inbalink シフトダッシュボード
          <span class="text-xs font-medium bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full border border-rose-200">リアルタイム自動連携</span>
        </h1>
        <p class="text-sm text-slate-500">Googleスプレッドシート直結管理（13:00〜18:00・30分単位）</p>
      </div>
    </div>
    <div class="flex flex-wrap gap-2">
      <button onclick="handleRefresh()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg font-bold shadow-md flex items-center gap-2 transition-all">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i> 最新データに更新
      </button>
      <button onclick="openStaffModal()" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-3 py-2 rounded-lg font-bold shadow-sm flex items-center gap-2 transition-all">
        <i data-lucide="user-plus" class="w-4 h-4 text-rose-600"></i> スタッフ・時給管理
      </button>
      <button onclick="openDiagnosticModal()" class="bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 px-3 py-2 rounded-lg font-medium shadow-sm flex items-center gap-2 transition-all">
        <i data-lucide="search" class="w-4 h-4"></i> 同期データ診断
      </button>
      <button onclick="window.print()" class="bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 px-3 py-2 rounded-lg font-medium shadow-sm flex items-center gap-2 transition-all">
        <i data-lucide="printer" class="w-4 h-4"></i> 共有・印刷
      </button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto space-y-6">
    
    <!-- KPIカード領域 -->
    <div id="kpiCardsContainer" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      
      <!-- 概算人件費合計 -->
      <div class="glass-card p-5 border-l-4 border-l-emerald-600 bg-emerald-50/20">
        <div class="flex justify-between items-start mb-2">
          <h3 class="text-xs font-bold text-slate-500">概算人件費合計</h3>
          <i data-lucide="japanese-yen" class="w-4 h-4 text-emerald-600"></i>
        </div>
        <div class="flex items-baseline gap-1">
          <span id="totalLaborCost" class="text-2xl lg:text-3xl font-extrabold text-emerald-700">¥0</span>
        </div>
        <p class="text-[11px] text-slate-400 mt-1" id="costScopeSubtitle">表示中の週の合計</p>
      </div>

      <!-- チーム稼働時間 -->
      <div class="glass-card p-5 border-l-4 border-l-slate-800">
        <div class="flex justify-between items-start mb-2">
          <h3 class="text-xs font-bold text-slate-500">チーム総稼働時間</h3>
          <i data-lucide="clock" class="w-4 h-4 text-slate-400"></i>
        </div>
        <div class="flex items-baseline gap-1">
          <span id="totalTeamHours" class="text-2xl lg:text-3xl font-extrabold text-slate-800">0.0</span>
          <span class="text-xs font-bold text-slate-500">時間</span>
        </div>
        <p class="text-[11px] text-slate-400 mt-1" id="hoursScopeSubtitle">表示中の週の合計</p>
      </div>
      
      <!-- スタッフ個別カード群 -->
      <div id="staffKpiInjectionPoint" class="contents"></div>
    </div>

    <!-- カレンダー・タイムライン切替領域 -->
    <div class="glass-card p-6">
      <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-6 gap-4">
        
        <div class="inline-flex items-center gap-3 p-1.5 px-3 bg-slate-50/80 border border-slate-200/80 rounded-2xl shadow-sm">
          <div class="relative">
            <select id="monthSelect" onchange="handleMonthChange(this.value)" class="appearance-none bg-white border border-rose-400 text-rose-700 font-bold text-sm rounded-xl pl-3 pr-8 py-1.5 focus:outline-none focus:ring-2 focus:ring-rose-200 cursor-pointer shadow-sm">
              <option value="2026-08">2026年8月</option>
              <option value="2026-09">2026年9月</option>
              <option value="2026-10">2026年10月</option>
              <option value="2026-11">2026年11月</option>
              <!-- 12月を追加 -->
              <option value="2026-12">2026年12月</option>
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-rose-600 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          </div>

          <div id="weekNavControls" class="flex items-center gap-1.5 text-slate-600 font-bold text-sm">
            <button onclick="changeWeek(-1)" title="前週" class="p-1 hover:text-rose-600 hover:bg-slate-200/60 rounded-md transition-colors">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <button onclick="goToCurrentWeek()" class="px-2 py-0.5 hover:text-rose-600 hover:bg-slate-200/60 rounded-md transition-colors text-xs font-bold text-slate-700">
              今週
            </button>
            <button onclick="changeWeek(1)" title="翌週" class="p-1 hover:text-rose-600 hover:bg-slate-200/60 rounded-md transition-colors">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="bg-rose-50/40 border border-rose-100/90 text-slate-800 font-bold text-xs px-3 py-1.5 rounded-xl shadow-inner">
            <span id="weekRangeLabel">読み込み中...</span>
          </div>
        </div>

        <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200">
          <button id="btnViewTable" onclick="switchView('table')" class="px-3 py-1.5 text-sm font-bold rounded-md bg-white shadow-sm text-slate-800 transition-all">週間一覧</button>
          <button id="btnViewTimeline" onclick="switchView('timeline')" class="px-3 py-1.5 text-sm font-bold rounded-md text-slate-500 hover:text-slate-700 transition-all">タイムライン (13-18時)</button>
          <button id="btnViewMonth" onclick="switchView('month')" class="px-3 py-1.5 text-sm font-bold rounded-md text-slate-500 hover:text-slate-700 transition-all">月間カレンダー</button>
        </div>
      </div>

      <!-- 週間テーブルビュー -->
      <div id="viewTable" class="overflow-x-auto">
        <table class="w-full border-collapse min-w-[800px]">
          <thead>
            <tr id="tableHeaderRow" class="border-y border-slate-200 bg-slate-50/50">
              <th class="p-3.5 text-left text-sm font-bold text-slate-500 w-48">スタッフ名</th>
            </tr>
          </thead>
          <tbody id="scheduleTableBody" class="divide-y divide-slate-100"></tbody>
          <tfoot>
            <tr id="tableFooterRow" class="border-t border-slate-200 bg-slate-50/50 font-bold text-sm">
              <td class="p-3.5 text-slate-500">出勤人数</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- タイムラインビュー -->
      <div id="viewTimeline" class="hidden">
        <div id="timelineContainer" class="space-y-6"></div>
      </div>

      <!-- 月間カレンダービュー -->
      <div id="viewMonth" class="hidden">
        <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50 text-center text-xs font-bold py-2 mb-2 rounded-t-lg">
          <div class="text-slate-600">月</div>
          <div class="text-slate-600">火</div>
          <div class="text-slate-600">水</div>
          <div class="text-slate-600">木</div>
          <div class="text-slate-600">金</div>
          <div class="text-blue-600">土</div>
          <div class="text-rose-600">日</div>
        </div>
        <div id="monthCalendarGrid" class="grid grid-cols-7 gap-2"></div>
      </div>
    </div>
  </main>

  <!-- スタッフ・時給管理モーダル -->
  <div id="staffModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-xl w-full max-h-[90vh] flex flex-col overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2">
          <i data-lucide="user-plus" class="w-5 h-5 text-rose-600"></i> スタッフ・時給管理
        </h2>
        <button onclick="closeStaffModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      
      <div class="p-6 overflow-y-auto flex-1 space-y-6">
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
          <h3 class="text-sm font-bold text-slate-700">新規スタッフ登録</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">スタッフ表示名</label>
              <input type="text" id="newStaffName" placeholder="例: 田中さん" class="w-full text-sm p-2 border border-slate-200 rounded-lg focus:outline-none focus:border-rose-500 bg-white">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">時給（円）</label>
              <input type="number" id="newStaffWage" placeholder="1500" value="1500" min="0" step="50" class="w-full text-sm p-2 border border-slate-200 rounded-lg focus:outline-none focus:border-rose-500 bg-white font-bold">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">識別カラー</label>
            <select id="newStaffColor" class="w-full text-sm p-2 border border-slate-200 rounded-lg focus:outline-none focus:border-rose-500 bg-white">
              <option value="blue">ブルー（青）</option>
              <option value="rose">ローズ（赤）</option>
              <option value="emerald">エメラルド（緑）</option>
              <option value="amber">アンバー（橙）</option>
              <option value="purple">パープル（紫）</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">スプレッドシートURL（シフト一覧タブ）</label>
            <input type="text" id="newStaffUrl" placeholder="https://docs.google.com/spreadsheets/d/.../edit?gid=..." class="w-full text-sm p-2 border border-slate-200 rounded-lg focus:outline-none focus:border-rose-500 bg-white">
          </div>
          <button onclick="handleAddStaff()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 rounded-lg text-sm transition-colors">
            スタッフを追加する
          </button>
        </div>

        <div>
          <h3 class="text-sm font-bold text-slate-700 mb-2">登録中スタッフと時給</h3>
          <p class="text-xs text-slate-400 mb-3">各スタッフの時給は入力欄から直接変更できます。</p>
          <div id="staffListContainer" class="space-y-2"></div>
        </div>
      </div>

      <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-between">
        <button onclick="resetDefaultStaff()" class="text-xs text-slate-400 hover:text-slate-600 underline">初期設定（2名）に戻す</button>
        <button onclick="closeStaffModal()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-1.5 rounded-lg text-sm font-bold">閉じる</button>
      </div>
    </div>
  </div>

  <div id="diagnosticModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2">
          <i data-lucide="search" class="w-5 h-5 text-blue-500"></i> 同期データ診断
        </h2>
        <button onclick="closeDiagnosticModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      <div id="diagnosticContent" class="p-6 overflow-y-auto flex-1 space-y-6"></div>
    </div>
  </div>

  <script>
    const DEFAULT_WAGE = 1500;
    const STORAGE_KEY = "inbalink_staff_list_v4";
    const defaultStaff = [
      { id: 'machida', name: '町田さん', color: 'blue', hourlyWage: DEFAULT_WAGE, url: 'https://docs.google.com/spreadsheets/d/1n2wpxJORZYjYQN3cRRyy2ONuvsqR36LYffJYLjskarc/edit?gid=354556482#gid=354556482' },
      { id: 'yamanaka', name: '山中さん', color: 'rose', hourlyWage: DEFAULT_WAGE, url: 'https://docs.google.com/spreadsheets/d/1KS1yanrIfaSyLTumRqdgfUSRI_MsQEMm5JooaXAVnJM/edit?gid=712987012#gid=712987012' }
    ];

    let staffConfig = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultStaff;

    staffConfig = staffConfig.map(s => ({
      ...s,
      hourlyWage: s.hourlyWage !== undefined ? Number(s.hourlyWage) : DEFAULT_WAGE
    }));

    function saveStaffConfig() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(staffConfig));
    }

    const colorMap = {
      blue: { bg: 'bg-blue-500', text: 'text-blue-600', light: 'bg-blue-50', border: 'border-blue-200' },
      rose: { bg: 'bg-rose-500', text: 'text-rose-600', light: 'bg-rose-50', border: 'border-rose-200' },
      emerald: { bg: 'bg-emerald-500', text: 'text-emerald-600', light: 'bg-emerald-50', border: 'border-emerald-200' },
      amber: { bg: 'bg-amber-500', text: 'text-amber-600', light: 'bg-amber-50', border: 'border-amber-200' },
      purple: { bg: 'bg-purple-500', text: 'text-purple-600', light: 'bg-purple-50', border: 'border-purple-200' }
    };

    const HOLIDAYS_JP = [
      '2026-01-01', '2026-01-12', '2026-02-11', '2026-02-23', '2026-03-20', '2026-04-29', '2026-05-03', '2026-05-04', '2026-05-05', '2026-05-06',
      '2026-07-20', '2026-08-11', '2026-09-21', '2026-09-22', '2026-09-23', '2026-10-12', '2026-11-03', '2026-11-23',
      '2027-01-01', '2027-01-11', '2027-02-11', '2027-02-23', '2027-03-21', '2027-03-22', '2027-04-29', '2027-05-03', '2027-05-04', '2027-05-05'
    ];

    function isHoliday(dateKey) {
      return HOLIDAYS_JP.includes(dateKey);
    }

    function getDayColorClass(dateKey, dayIdx) {
      if (isHoliday(dateKey) || dayIdx === 6) return { text: 'text-rose-600', bg: 'bg-rose-50/40' };
      if (dayIdx === 5) return { text: 'text-blue-600', bg: 'bg-blue-50/30' };
      return { text: 'text-slate-500', bg: '' };
    }

    let shiftData = {}; 
    let currentBaseDate = new Date(); 
    let currentView = 'table';
    let diagnosticLogs = {};

    function init() {
      lucide.createIcons();
      
      // 今月の年と月を取得してプルダウンにセットする処理
      const today = new Date();
      const y = today.getFullYear();
      const m = String(today.getMonth() + 1).padStart(2, '0');
      const currentMonthVal = `${y}-${m}`;
      
      const monthSelect = document.getElementById('monthSelect');
      if (monthSelect) {
        let optionExists = false;
        for (let i = 0; i < monthSelect.options.length; i++) {
          if (monthSelect.options[i].value === currentMonthVal) {
            optionExists = true;
            break;
          }
        }
        if (optionExists) {
