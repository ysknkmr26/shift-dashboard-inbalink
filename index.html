<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>㈱Inbalink シフト一覧</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif; background-color: #f8fafc; }
    .glass-card { background: white; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1); border: 1px solid #f1f5f9; }
    .timeline-bg { background-image: repeating-linear-gradient(to right, transparent, transparent 49px, #e2e8f0 49px, #e2e8f0 50px); background-size: 50px 100%; }
  </style>
</head>
<body class="p-4 md:p-8 text-slate-800">
  
  <!-- ヘッダー -->
  <header class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
    <div class="flex items-center gap-3">
      <div class="bg-rose-600 p-2.5 rounded-xl text-white">
        <i data-lucide="calendar-days" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="text-2xl font-bold text-slate-800 flex items-center gap-2">
          ㈱Inbalink シフト一覧
          <span class="text-xs font-medium bg-rose-100 text-rose-600 px-2 py-0.5 rounded-full border border-rose-200">リアルタイム自動連携</span>
        </h1>
        <p class="text-sm text-slate-500">Googleスプレッドシート直結管理</p>
      </div>
    </div>
    <div class="flex flex-wrap gap-2">
      <button onclick="handleRefresh()" class="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-lg font-bold shadow-md flex items-center gap-2 transition-all">
        <i data-lucide="refresh-cw" class="w-4 h-4"></i> 最新データに更新
      </button>
      <button onclick="openStaffModal()" class="bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 px-3 py-2 rounded-lg font-bold shadow-sm flex items-center gap-2 transition-all">
        <i data-lucide="user-plus" class="w-4 h-4 text-rose-600"></i> ワーカー追加・管理
      </button>
      <button onclick="openDiagnosticModal()" class="bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 px-3 py-2 rounded-lg font-medium shadow-sm flex items-center gap-2 transition-all">
        <i data-lucide="search" class="w-4 h-4"></i> 同期データ診断
      </button>
      <button onclick="window.print()" class="bg-white hover:bg-slate-50 text-slate-600 border border-slate-200 px-3 py-2 rounded-lg font-medium shadow-sm flex items-center gap-2 transition-all">
        <i data-lucide="printer" class="w-4 h-4"></i> 共有・印刷
      </button>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-6xl mx-auto space-y-6">
    
    <!-- KPIカード領域 -->
    <div id="kpiCardsContainer" class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="glass-card p-5 border-l-4 border-l-slate-800">
        <div class="flex justify-between items-start mb-2">
          <h3 class="text-sm font-bold text-slate-500" id="kpiScopeTitle">チーム総稼働時間</h3>
          <i data-lucide="clock" class="w-4 h-4 text-slate-400"></i>
        </div>
        <div class="flex items-baseline gap-1">
          <span id="totalTeamHours" class="text-3xl font-extrabold text-slate-800">0.0</span>
          <span class="text-sm font-bold text-slate-500">時間</span>
        </div>
        <p class="text-xs text-slate-400 mt-1" id="kpiScopeSubtitle">表示中の週の合計</p>
      </div>
      
      <div class="glass-card p-5 border-l-4 border-l-rose-500">
        <div class="flex justify-between items-start mb-2">
          <h3 class="text-sm font-bold text-slate-500">複数名出勤</h3>
          <i data-lucide="users" class="w-4 h-4 text-rose-400"></i>
        </div>
        <div class="flex items-baseline gap-1">
          <span id="overlapDays" class="text-3xl font-extrabold text-rose-600">0</span>
          <span class="text-sm font-bold text-slate-500">日間</span>
        </div>
        <p class="text-xs text-slate-400 mt-1">手厚い稼働日</p>
      </div>
      
      <div id="staffKpiInjectionPoint" class="contents"></div>
    </div>

    <!-- カレンダー・タイムライン切替領域 -->
    <div class="glass-card p-6">
      <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center mb-6 gap-4">
        
        <!-- ナビゲーションバー -->
        <div class="inline-flex items-center gap-3 p-1.5 px-3 bg-slate-50/80 border border-slate-200/80 rounded-2xl shadow-sm">
          <div class="relative">
            <select id="monthSelect" onchange="handleMonthChange(this.value)" class="appearance-none bg-white border border-rose-400 text-rose-700 font-bold text-sm rounded-xl pl-3 pr-8 py-1.5 focus:outline-none focus:ring-2 focus:ring-rose-200 cursor-pointer shadow-sm">
              <option value="2026-08">2026年8月</option>
              <option value="2026-09" selected>2026年9月</option>
              <option value="2026-10">2026年10月</option>
              <option value="2026-11">2026年11月</option>
              <option value="2026-12">2026年12月</option>
            </select>
            <i data-lucide="chevron-down" class="w-4 h-4 text-rose-600 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          </div>

          <div id="weekNavControls" class="flex items-center gap-1.5 text-slate-600 font-bold text-sm">
            <button onclick="changeWeek(-1)" title="前週" class="p-1 hover:text-rose-600 hover:bg-slate-200/60 rounded-md transition-colors">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
            </button>
            <button onclick="goToCurrentWeek()" class="px-2 py-0.5 hover:text-rose-600 hover:bg-slate-200/60 rounded-md transition-colors text-xs font-bold text-slate-700">
              今週
            </button>
            <button onclick="changeWeek(1)" title="翌週" class="p-1 hover:text-rose-600 hover:bg-slate-200/60 rounded-md transition-colors">
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
          </div>

          <div class="bg-rose-50/40 border border-rose-100/90 text-slate-800 font-bold text-xs px-3 py-1.5 rounded-xl shadow-inner">
            <span id="weekRangeLabel">2026年9月14日 〜 9月20日</span>
          </div>
        </div>

        <!-- 表示切り替えボタングループ（月間カレンダーを追加） -->
        <div class="flex bg-slate-100 p-1 rounded-lg border border-slate-200">
          <button id="btnViewTable" onclick="switchView('table')" class="px-3 py-1.5 text-sm font-bold rounded-md bg-white shadow-sm text-slate-800 transition-all">週間一覧</button>
          <button id="btnViewTimeline" onclick="switchView('timeline')" class="px-3 py-1.5 text-sm font-bold rounded-md text-slate-500 hover:text-slate-700 transition-all">タイムライン (13-18時)</button>
          <button id="btnViewMonth" onclick="switchView('month')" class="px-3 py-1.5 text-sm font-bold rounded-md text-slate-500 hover:text-slate-700 transition-all">月間カレンダー</button>
        </div>
      </div>

      <!-- 週間テーブルビュー -->
      <div id="viewTable" class="overflow-x-auto">
        <table class="w-full border-collapse min-w-[800px]">
          <thead>
            <tr id="tableHeaderRow" class="border-y border-slate-200 bg-slate-50/50">
              <th class="p-3.5 text-left text-sm font-bold text-slate-500 w-48">スタッフ名</th>
            </tr>
          </thead>
          <tbody id="scheduleTableBody" class="divide-y divide-slate-100"></tbody>
          <tfoot>
            <tr id="tableFooterRow" class="border-t border-slate-200 bg-slate-50/50 font-bold text-sm">
              <td class="p-3.5 text-slate-500">出勤人数</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- タイムラインビュー -->
      <div id="viewTimeline" class="hidden">
        <div id="timelineContainer" class="space-y-6"></div>
      </div>

      <!-- 月間カレンダービュー -->
      <div id="viewMonth" class="hidden">
        <div class="grid grid-cols-7 border-b border-slate-200 bg-slate-50 text-center text-xs font-bold py-2 mb-2 rounded-t-lg">
          <div class="text-slate-600">月</div>
          <div class="text-slate-600">火</div>
          <div class="text-slate-600">水</div>
          <div class="text-slate-600">木</div>
          <div class="text-slate-600">金</div>
          <div class="text-blue-600">土</div>
          <div class="text-rose-600">日</div>
        </div>
        <div id="monthCalendarGrid" class="grid grid-cols-7 gap-2"></div>
      </div>
    </div>
  </main>

  <!-- スタッフ追加・管理モーダル -->
  <div id="staffModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-xl w-full max-h-[90vh] flex flex-col overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2">
          <i data-lucide="user-plus" class="w-5 h-5 text-rose-600"></i> スタッフ追加・管理
        </h2>
        <button onclick="closeStaffModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      
      <div class="p-6 overflow-y-auto flex-1 space-y-6">
        <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
          <h3 class="text-sm font-bold text-slate-700">新規スタッフ登録</h3>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">スタッフ表示名</label>
            <input type="text" id="newStaffName" placeholder="例: 田中さん" class="w-full text-sm p-2 border border-slate-200 rounded-lg focus:outline-none focus:border-rose-500 bg-white">
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">識別カラー</label>
            <select id="newStaffColor" class="w-full text-sm p-2 border border-slate-200 rounded-lg focus:outline-none focus:border-rose-500 bg-white">
              <option value="blue">ブルー（青）</option>
              <option value="rose">ローズ（赤）</option>
              <option value="emerald">エメラルド（緑）</option>
              <option value="amber">アンバー（橙）</option>
              <option value="purple">パープル（紫）</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-500 mb-1">スプレッドシートURL（シフト一覧タブ）</label>
            <input type="text" id="newStaffUrl" placeholder="https://docs.google.com/spreadsheets/d/.../edit?gid=..." class="w-full text-sm p-2 border border-slate-200 rounded-lg focus:outline-none focus:border-rose-500 bg-white">
          </div>
          <button onclick="handleAddStaff()" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2 rounded-lg text-sm transition-colors">
            スタッフを追加する
          </button>
        </div>

        <div>
          <h3 class="text-sm font-bold text-slate-700 mb-3">登録中スタッフ一覧</h3>
          <div id="staffListContainer" class="space-y-2"></div>
        </div>
      </div>

      <div class="p-4 border-t border-slate-100 bg-slate-50 flex justify-between">
        <button onclick="resetDefaultStaff()" class="text-xs text-slate-400 hover:text-slate-600 underline">初期設定（2名）に戻す</button>
        <button onclick="closeStaffModal()" class="bg-slate-800 hover:bg-slate-700 text-white px-4 py-1.5 rounded-lg text-sm font-bold">閉じる</button>
      </div>
    </div>
  </div>

  <!-- 同期データ診断モーダル -->
  <div id="diagnosticModal" class="fixed inset-0 bg-slate-900/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-xl shadow-2xl max-w-4xl w-full max-h-[90vh] flex flex-col overflow-hidden">
      <div class="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
        <h2 class="font-bold text-lg text-slate-800 flex items-center gap-2">
          <i data-lucide="search" class="w-5 h-5 text-blue-500"></i> 同期データ診断
        </h2>
        <button onclick="closeDiagnosticModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      <div id="diagnosticContent" class="p-6 overflow-y-auto flex-1 space-y-6"></div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "inbalink_staff_list_v1";
    const defaultStaff = [
      { id: 'machida', name: '町田さん', color: 'blue', url: 'https://docs.google.com/spreadsheets/d/1n2wpxJORZYjYQN3cRRyy2ONuvsqR36LYffJYLjskarc/edit?gid=354556482#gid=354556482' },
      { id: 'yamanaka', name: '山中さん', color: 'rose', url: 'https://docs.google.com/spreadsheets/d/1KS1yanrIfaSyLTumRqdgfUSRI_MsQEMm5JooaXAVnJM/edit?gid=712987012#gid=712987012' }
    ];

    let staffConfig = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultStaff;

    function saveStaffConfig() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(staffConfig));
    }

    const colorMap = {
      blue: { bg: 'bg-blue-500', text: 'text-blue-600', light: 'bg-blue-50', border: 'border-blue-200' },
      rose: { bg: 'bg-rose-500', text: 'text-rose-600', light: 'bg-rose-50', border: 'border-rose-200' },
      emerald: { bg: 'bg-emerald-500', text: 'text-emerald-600', light: 'bg-emerald-50', border: 'border-emerald-200' },
      amber: { bg: 'bg-amber-500', text: 'text-amber-600', light: 'bg-amber-50', border: 'border-amber-200' },
      purple: { bg: 'bg-purple-500', text: 'text-purple-600', light: 'bg-purple-50', border: 'border-purple-200' }
    };

    const HOLIDAYS_JP = [
      '2026-01-01', '2026-01-12', '2026-02-11', '2026-02-23', '2026-03-20', '2026-04-29', '2026-05-03', '2026-05-04', '2026-05-05', '2026-05-06',
      '2026-07-20', '2026-08-11', '2026-09-21', '2026-09-22', '2026-09-23', '2026-10-12', '2026-11-03', '2026-11-23',
      '2027-01-01', '2027-01-11', '2027-02-11', '2027-02-23', '2027-03-21', '2027-03-22', '2027-04-29', '2027-05-03', '2027-05-04', '2027-05-05'
    ];

    function isHoliday(dateKey) {
      return HOLIDAYS_JP.includes(dateKey);
    }

    function getDayColorClass(dateKey, dayIdx) {
      if (isHoliday(dateKey) || dayIdx === 6) return { text: 'text-rose-600', bg: 'bg-rose-50/40' };
      if (dayIdx === 5) return { text: 'text-blue-600', bg: 'bg-blue-50/30' };
      return { text: 'text-slate-500', bg: '' };
    }

    let shiftData = {}; 
    let currentBaseDate = new Date(2026, 8, 14); // 2026-09-14基準
    let currentView = 'table';
    let diagnosticLogs = {};

    function init() {
      lucide.createIcons();
      updateKpiCardsUI();
      handleRefresh();
    }

    window.gvizCallback = {};

    async function handleRefresh() {
      const btn = document.querySelector('button[onclick="handleRefresh()"]');
      const originalHtml = btn.innerHTML;
      btn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> 同期中...`;
      btn.disabled = true;
      lucide.createIcons();

      shiftData = {};
      diagnosticLogs = {};

      const promises = staffConfig.map(staff => fetchSpreadsheetData(staff));
      await Promise.allSettled(promises);

      renderDashboard();

      btn.innerHTML = originalHtml;
      btn.disabled = false;
      lucide.createIcons();
    }

    function fetchSpreadsheetData(staff) {
      return new Promise((resolve) => {
        const urlMatch = staff.url.match(/\/d\/([a-zA-Z0-9-_]+)/);
        if (!urlMatch) {
          logDiagnostic(staff.id, "エラー", 0, "URL形式が無効です。");
          resolve(); return;
        }
        const sheetId = urlMatch[1];
        
        let gidPart = "";
        const gidMatch = staff.url.match(/gid=([0-9]+)/);
        if (gidMatch) gidPart = `&gid=${gidMatch[1]}`;

        const gvizUrl = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json;responseHandler:gvizCallback.cb_${staff.id}${gidPart}`;

        window.gvizCallback[`cb_${staff.id}`] = function(json) {
          parseGvizDataFlexible(json, staff);
          resolve();
        };

        const script = document.createElement('script');
        script.src = gvizUrl;
        script.onerror = () => {
          logDiagnostic(staff.id, "通信エラー", 0, "スプレッドシートへのアクセスに失敗しました。共有設定を確認してください。");
          resolve();
        };
        document.body.appendChild(script);
      });
    }

    function parseGvizDataFlexible(json, staff) {
      if (!json || !json.table || !json.table.rows) {
        logDiagnostic(staff.id, "エラー", 0, "スプレッドシートからデータが返されませんでした。");
        return;
      }
      
      const rows = json.table.rows;
      let parsedCount = 0;
      let logs = [];
      if (!shiftData[staff.id]) shiftData[staff.id] = {};

      for (let r = 0; r < rows.length; r++) {
        const row = rows[r];
        if (!row || !row.c) continue;

        let rowDateKey = null;
        let timeValues = [];

        for (let c = 0; c < row.c.length; c++) {
          const cell = row.c[c];
          if (!cell) continue;

          if (!rowDateKey) {
            const rawVal = cell.f || cell.v;
            const parsedDate = normalizeDate(rawVal);
            if (parsedDate) {
              rowDateKey = parsedDate;
              continue;
            }
          }

          const rawTime = cell.f || cell.v;
          const parsedTime = normalizeTime(rawTime);
          if (parsedTime) {
            timeValues.push(parsedTime);
          }
        }

        if (rowDateKey && timeValues.length >= 1) {
          const startStr = timeValues[0];
          let endStr = timeValues.length >= 2 ? timeValues[1] : "18:00";

          const sDec = timeToDecimal(startStr);
          const eDec = timeToDecimal(endStr);

          if (eDec > sDec) {
            const hrs = eDec - sDec;
            shiftData[staff.id][rowDateKey] = {
              start: startStr,
              end: endStr,
              hours: hrs,
              raw: `${startStr}〜${endStr}`
            };
            parsedCount++;

            if (logs.length < 5) {
              logs.push({
                parsedDate: rowDateKey,
                time: `${startStr} - ${endStr}`,
                status: '正常',
                hours: hrs
              });
            }
          }
        }
      }

      if (parsedCount > 0) {
        logDiagnostic(staff.id, "成功", rows.length, `${parsedCount}件のシフトを正常に抽出しました。`, logs);
      } else {
        logDiagnostic(staff.id, "解析失敗", rows.length, `全${rows.length}行を走査しましたが、有効な日付と時刻が見つかりませんでした。`, logs);
      }
    }

    function normalizeDate(val) {
      if (!val) return null;
      let s = String(val);
      const dMatch = s.match(/Date\((\d+),\s*(\d+),\s*(\d+)/);
      if (dMatch) {
        let m = String(parseInt(dMatch[2]) + 1).padStart(2, '0');
        let d = String(dMatch[3]).padStart(2, '0');
        return `${dMatch[1]}-${m}-${d}`;
      }
      const isoMatch = s.match(/(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})/);
      if (isoMatch) {
        let m = String(isoMatch[2]).padStart(2, '0');
        let d = String(isoMatch[3]).padStart(2, '0');
        return `${isoMatch[1]}-${m}-${d}`;
      }
      return null;
    }

    function normalizeTime(val) {
      if (!val) return null;
      if (Array.isArray(val) && val.length >= 2) {
        return `${String(val[0]).padStart(2, '0')}:${String(val[1]).padStart(2, '0')}`;
      }
      let s = String(val);
      let tMatch = s.match(/^(\d{1,2})[:：](\d{2})$/);
      if (tMatch) {
        let h = parseInt(tMatch[1]);
        if (h >= 8 && h <= 22) {
          return `${String(h).padStart(2, '0')}:${tMatch[2]}`;
        }
      }
      return null;
    }

    function timeToDecimal(tStr) {
      const parts = tStr.split(':');
      return parseInt(parts[0]) + parseInt(parts[1]) / 60;
    }

    function logDiagnostic(staffId, status, totalRows, message, logs = []) {
      diagnosticLogs[staffId] = { status, totalRows, message, logs };
    }

    function getWeekDates(baseDate) {
      const dates = [];
      const current = new Date(baseDate);
      const day = current.getDay();
      const diff = current.getDate() - day + (day === 0 ? -6 : 1);
      current.setDate(diff);

      for (let i = 0; i < 7; i++) {
        const y = current.getFullYear();
        const m = String(current.getMonth() + 1).padStart(2, '0');
        const d = String(current.getDate()).padStart(2, '0');
        dates.push({
          dateKey: `${y}-${m}-${d}`,
          year: y,
          month: current.getMonth() + 1,
          date: current.getDate(),
          dayIdx: i
        });
        current.setDate(current.getDate() + 1);
      }
      return dates;
    }

    function changeWeek(offset) {
      currentBaseDate.setDate(currentBaseDate.getDate() + (offset * 7));
      syncMonthSelectWithDate();
      renderDashboard();
    }

    function goToCurrentWeek() {
      currentBaseDate = new Date(2026, 8, 14);
      syncMonthSelectWithDate();
      renderDashboard();
    }

    function handleMonthChange(val) {
      const parts = val.split('-');
      currentBaseDate = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, 14);
      renderDashboard();
    }

    function syncMonthSelectWithDate() {
      const y = currentBaseDate.getFullYear();
      const m = String(currentBaseDate.getMonth() + 1).padStart(2, '0');
      const val = `${y}-${m}`;
      const sel = document.getElementById('monthSelect');
      if (sel) {
        for (let opt of sel.options) {
          if (opt.value === val) {
            sel.value = val;
            break;
          }
        }
      }
    }

    function switchView(view) {
      currentView = view;
      document.getElementById('viewTable').classList.toggle('hidden', view !== 'table');
      document.getElementById('viewTimeline').classList.toggle('hidden', view !== 'timeline');
      document.getElementById('viewMonth').classList.toggle('hidden', view !== 'month');

      document.getElementById('weekNavControls').classList.toggle('hidden', view === 'month');

      const btnBase = "px-3 py-1.5 text-sm font-bold rounded-md transition-all";
      const btnActive = "bg-white shadow-sm text-slate-800";
      const btnInactive = "text-slate-500 hover:text-slate-700";

      document.getElementById('btnViewTable').className = `${btnBase} ${view === 'table' ? btnActive : btnInactive}`;
      document.getElementById('btnViewTimeline').className = `${btnBase} ${view === 'timeline' ? btnActive : btnInactive}`;
      document.getElementById('btnViewMonth').className = `${btnBase} ${view === 'month' ? btnActive : btnInactive}`;

      renderDashboard();
    }

    function updateKpiCardsUI() {
      const container = document.getElementById('staffKpiInjectionPoint');
      let html = '';
      staffConfig.forEach(staff => {
        const color = colorMap[staff.color] || colorMap.blue;
        html += `
          <div class="glass-card p-5 border-t-4 border-t-${staff.color}-500 flex flex-col justify-between">
            <div class="flex justify-between items-start mb-2">
              <h3 class="text-sm font-bold text-slate-500">${staff.name}</h3>
              <div class="w-3 h-3 rounded-full ${color.bg}"></div>
            </div>
            <div class="flex items-baseline gap-1 mt-auto">
              <span id="kpi-hrs-${staff.id}" class="text-3xl font-extrabold text-slate-800">0.0</span>
              <span class="text-sm font-bold text-slate-500">時間</span>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function renderDashboard() {
      if (currentView === 'month') {
        renderMonthCalendar();
      } else {
        renderWeekDashboard();
      }
      lucide.createIcons();
    }

    function renderWeekDashboard() {
      const dates = getWeekDates(currentBaseDate);
      const dayHeaders = ['月', '火', '水', '木', '金', '土', '日'];
      
      document.getElementById('weekRangeLabel').textContent = `${dates[0].year}年${dates[0].month}月${dates[0].date}日 〜 ${dates[6].month}月${dates[6].date}日`;
      document.getElementById('kpiScopeSubtitle').textContent = "表示中の週の合計";

      let thHtml = `<th class="p-3.5 text-left text-sm font-bold text-slate-500 w-48 border-r border-slate-200">スタッフ名</th>`;
      dates.forEach((d, idx) => {
        const colClass = getDayColorClass(d.dateKey, idx);
        thHtml += `
          <th class="p-3.5 text-center ${colClass.text} ${colClass.bg}">
            <div class="text-sm font-extrabold mb-0.5">${d.month}/${d.date}</div>
            <div class="text-xs font-bold">${dayHeaders[idx]}</div>
          </th>
        `;
      });
      thHtml += `<th class="p-3.5 text-center text-sm font-bold text-slate-500 w-24">週合計</th>`;
      document.getElementById('tableHeaderRow').innerHTML = thHtml;

      let tbHtml = '';
      let dailyCounts = [0,0,0,0,0,0,0];
      let totalTeamHours = 0;
      let overlapDaysCount = 0;

      dates.forEach((d, idx) => {
        let workers = 0;
        staffConfig.forEach(staff => {
          if (shiftData[staff.id] && shiftData[staff.id][d.dateKey]) workers++;
        });
        if (workers >= 2) overlapDaysCount++;
      });

      staffConfig.forEach(staff => {
        let staffWeekHrs = 0;
        const color = colorMap[staff.color] || colorMap.blue;
        
        tbHtml += `<tr>`;
        tbHtml += `
          <td class="p-3.5 border-r border-slate-100">
            <div class="flex items-center gap-2">
              <div class="w-3 h-3 rounded-full ${color.bg}"></div>
              <span class="font-bold text-slate-700">${staff.name}</span>
            </div>
          </td>
        `;

        dates.forEach((d, idx) => {
          const shift = shiftData[staff.id] ? shiftData[staff.id][d.dateKey] : null;
          const colClass = getDayColorClass(d.dateKey, idx);
          
          if (shift) {
            staffWeekHrs += shift.hours;
            dailyCounts[idx]++;
            tbHtml += `
              <td class="p-2.5 text-center ${colClass.bg}">
                <div class="p-2 rounded-xl ${color.light} ${color.text} border ${color.border} text-xs font-bold shadow-sm">
                  ${shift.start}-${shift.end}<br><span class="opacity-75">${shift.hours}h</span>
                </div>
              </td>
            `;
          } else {
            tbHtml += `
              <td class="p-2.5 text-center ${colClass.bg}">
                <div class="p-2 rounded-xl border border-dashed border-slate-200 text-slate-300 text-xs">未定</div>
              </td>
            `;
          }
        });

        tbHtml += `<td class="p-3.5 text-center font-bold text-slate-700 bg-slate-50/50">${staffWeekHrs.toFixed(1)}h</td></tr>`;
        
        totalTeamHours += staffWeekHrs;
        const kpiEl = document.getElementById(`kpi-hrs-${staff.id}`);
        if (kpiEl) kpiEl.textContent = staffWeekHrs.toFixed(1);
      });

      document.getElementById('scheduleTableBody').innerHTML = tbHtml;
      
      let tfHtml = `<td class="p-3.5 text-slate-500 border-r border-slate-200">出勤人数 / 重複</td>`;
      dates.forEach((d, idx) => {
        const count = dailyCounts[idx];
        const colClass = getDayColorClass(d.dateKey, idx);
        let badge = count >= 2 
          ? `<span class="bg-rose-100 text-rose-600 px-2 py-0.5 rounded-md">${count}名</span>` 
          : `<span class="text-slate-400">${count}名</span>`;
        tfHtml += `<td class="p-3.5 text-center font-bold ${colClass.bg}">${badge}</td>`;
      });
      tfHtml += `<td class="p-3.5 text-center font-bold text-slate-400"></td>`;
      document.getElementById('tableFooterRow').innerHTML = tfHtml;

      document.getElementById('totalTeamHours').textContent = totalTeamHours.toFixed(1);
      document.getElementById('overlapDays').textContent = overlapDaysCount;

      renderTimeline(dates);
    }

    function renderMonthCalendar() {
      const year = currentBaseDate.getFullYear();
      const month = currentBaseDate.getMonth(); // 0-based
      const firstDay = new Date(year, month, 1);
      const lastDay = new Date(year, month + 1, 0);

      document.getElementById('weekRangeLabel').textContent = `${year}年${month + 1}月 全体表示`;
      document.getElementById('kpiScopeSubtitle').textContent = `${month + 1}月全体の合計`;

      // 月初日の曜日（月曜始まりに換算: 日=6, 月=0, 火=1...）
      let startDayOfWeek = firstDay.getDay() - 1;
      if (startDayOfWeek === -1) startDayOfWeek = 6;

      const totalDays = lastDay.getDate();
      const grid = document.getElementById('monthCalendarGrid');
      let html = '';

      let totalMonthHours = 0;
      let overlapMonthDays = 0;
      let staffMonthHrs = {};
      staffConfig.forEach(s => staffMonthHrs[s.id] = 0);

      // 前月の余白埋め
      for (let i = 0; i < startDayOfWeek; i++) {
        html += `<div class="min-h-[100px] p-2 bg-slate-50/40 rounded-xl border border-dashed border-slate-200 opacity-40"></div>`;
      }

      // 当月の日付
      for (let day = 1; day <= totalDays; day++) {
        const mStr = String(month + 1).padStart(2, '0');
        const dStr = String(day).padStart(2, '0');
        const dateKey = `${year}-${mStr}-${dStr}`;

        const dateObj = new Date(year, month, day);
        let dIdx = dateObj.getDay() - 1;
        if (dIdx === -1) dIdx = 6;

        const colClass = getDayColorClass(dateKey, dIdx);

        // その日のシフト取得
        let dailyWorkers = [];
        staffConfig.forEach(staff => {
          const shift = shiftData[staff.id] ? shiftData[staff.id][dateKey] : null;
          if (shift) {
            dailyWorkers.push({ staff, shift });
            staffMonthHrs[staff.id] += shift.hours;
            totalMonthHours += shift.hours;
          }
        });

        if (dailyWorkers.length >= 2) overlapMonthDays++;

        let shiftsHtml = '';
        dailyWorkers.forEach(({ staff, shift }) => {
          const color = colorMap[staff.color] || colorMap.blue;
          shiftsHtml += `
            <div class="text-[11px] font-bold p-1 rounded-md ${color.light} ${color.text} border ${color.border} truncate mb-1">
              ${staff.name.replace('さん', '')}: ${shift.start}-${shift.end}
            </div>
          `;
        });

        html += `
          <div class="min-h-[110px] p-2 rounded-xl border border-slate-200/90 flex flex-col justify-between ${colClass.bg || 'bg-white'} hover:border-slate-300 transition-all">
            <div class="flex justify-between items-start mb-1">
              <span class="text-sm font-extrabold ${colClass.text}">${day}</span>
              ${dailyWorkers.length >= 2 ? `<span class="text-[10px] font-bold bg-rose-100 text-rose-600 px-1 rounded">重 ${dailyWorkers.length}</span>` : ''}
            </div>
            <div class="flex-1 overflow-y-auto max-h-[75px] space-y-1">
              ${shiftsHtml}
            </div>
          </div>
        `;
      }

      // 翌月の余白埋め（7の倍数に揃える）
      const remainingCells = (7 - ((startDayOfWeek + totalDays) % 7)) % 7;
      for (let i = 0; i < remainingCells; i++) {
        html += `<div class="min-h-[100px] p-2 bg-slate-50/40 rounded-xl border border-dashed border-slate-200 opacity-40"></div>`;
      }

      grid.innerHTML = html;

      // 月間集計KPIの更新
      document.getElementById('totalTeamHours').textContent = totalMonthHours.toFixed(1);
      document.getElementById('overlapDays').textContent = overlapMonthDays;
      staffConfig.forEach(staff => {
        const kpiEl = document.getElementById(`kpi-hrs-${staff.id}`);
        if (kpiEl) kpiEl.textContent = staffMonthHrs[staff.id].toFixed(1);
      });
    }

    function renderTimeline(dates) {
      const container = document.getElementById('timelineContainer');
      let html = '';
      const dayHeaders = ['月', '火', '水', '木', '金', '土', '日'];

      dates.forEach((d, idx) => {
        const workers = staffConfig.filter(s => shiftData[s.id] && shiftData[s.id][d.dateKey]);
        if (workers.length === 0) return;

        const colClass = getDayColorClass(d.dateKey, idx);
        const dayLabelColor = colClass.text !== 'text-slate-500' ? colClass.text : 'text-slate-800';

        html += `
          <div class="glass-card overflow-hidden">
            <div class="flex items-center gap-4 p-3 bg-slate-50 border-b border-slate-100">
              <div class="w-16 text-center">
                <div class="text-sm font-extrabold ${dayLabelColor}">${d.month}/${d.date}</div>
                <div class="text-xs font-bold ${dayLabelColor}">${dayHeaders[idx]}</div>
              </div>
              <div class="flex-1 text-xs text-slate-400 flex justify-between px-2">
                <span>13:00</span><span>14:00</span><span>15:00</span><span>16:00</span><span>17:00</span><span>18:00</span>
              </div>
            </div>
            <div class="p-3 timeline-bg relative" style="height: ${workers.length * 40 + 20}px;">
        `;

        workers.forEach((staff, wIdx) => {
          const shift = shiftData[staff.id][d.dateKey];
          const color = colorMap[staff.color] || colorMap.blue;
          const sDec = Math.max(13, timeToDecimal(shift.start));
          const eDec = Math.min(18, timeToDecimal(shift.end));
          
          if (eDec > sDec) {
            const leftPct = ((sDec - 13) / 5) * 100;
            const widthPct = ((eDec - sDec) / 5) * 100;
            const topPx = wIdx * 40 + 10;
            
            html += `
              <div class="absolute h-8 rounded-lg ${color.bg} shadow-sm flex items-center px-3 text-white text-xs font-bold overflow-hidden whitespace-nowrap"
                   style="left: ${leftPct}%; width: ${widthPct}%; top: ${topPx}px;">
                ${staff.name} (${shift.start}-${shift.end})
              </div>
            `;
          }
        });
        html += `</div></div>`;
      });

      if (html === '') {
        html = `<div class="text-center text-slate-400 py-10 font-bold">この週の出勤予定はありません</div>`;
      }
      container.innerHTML = html;
    }

    function openStaffModal() {
      renderStaffList();
      document.getElementById('staffModal').classList.replace('hidden', 'flex');
      lucide.createIcons();
    }

    function closeStaffModal() {
      document.getElementById('staffModal').classList.replace('flex', 'hidden');
    }

    function renderStaffList() {
      const container = document.getElementById('staffListContainer');
      let html = '';
      staffConfig.forEach((staff, idx) => {
        const color = colorMap[staff.color] || colorMap.blue;
        html += `
          <div class="flex items-center justify-between p-3 bg-white border border-slate-200 rounded-lg text-sm">
            <div class="flex items-center gap-2 overflow-hidden mr-2">
              <div class="w-3 h-3 rounded-full ${color.bg} shrink-0"></div>
              <span class="font-bold text-slate-700 shrink-0">${staff.name}</span>
              <span class="text-xs text-slate-400 truncate max-w-[240px]">${staff.url}</span>
            </div>
            <button onclick="handleDeleteStaff(${idx})" class="text-rose-500 hover:text-rose-700 p-1 rounded hover:bg-rose-50 shrink-0">
              <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
          </div>
        `;
      });
      container.innerHTML = html;
      lucide.createIcons();
    }

    function handleAddStaff() {
      const name = document.getElementById('newStaffName').value.trim();
      const color = document.getElementById('newStaffColor').value;
      const url = document.getElementById('newStaffUrl').value.trim();

      if (!name || !url) {
        alert('名前とスプレッドシートURLを入力してください。');
        return;
      }

      const id = 'staff_' + Date.now();
      staffConfig.push({ id, name, color, url });
      saveStaffConfig();

      document.getElementById('newStaffName').value = '';
      document.getElementById('newStaffUrl').value = '';

      updateKpiCardsUI();
      renderStaffList();
      handleRefresh();
    }

    function handleDeleteStaff(idx) {
      if (confirm(`${staffConfig[idx].name} を削除しますか？`)) {
        staffConfig.splice(idx, 1);
        saveStaffConfig();
        updateKpiCardsUI();
        renderStaffList();
        handleRefresh();
      }
    }

    function resetDefaultStaff() {
      if (confirm('初期設定（町田さん・山中さん）に戻しますか？')) {
        staffConfig = [...defaultStaff];
        saveStaffConfig();
        updateKpiCardsUI();
        renderStaffList();
        handleRefresh();
      }
    }

    function openDiagnosticModal() {
      const content = document.getElementById('diagnosticContent');
      let html = '';
      
      staffConfig.forEach(staff => {
        const log = diagnosticLogs[staff.id];
        if (!log) {
          html += `<div class="p-4 bg-slate-50 rounded-lg text-slate-500">${staff.name}: データ未取得</div>`;
          return;
        }

        const color = colorMap[staff.color] || colorMap.blue;
        html += `
          <div class="border border-slate-200 rounded-xl overflow-hidden">
            <div class="p-3 bg-slate-50 border-b border-slate-200 flex justify-between items-center">
              <div class="font-bold flex items-center gap-2 text-slate-700">
                <div class="w-3 h-3 rounded-full ${color.bg}"></div>
                ${staff.name}
              </div>
              <span class="text-xs font-bold ${log.status==='成功' ? 'text-emerald-600 bg-emerald-100' : 'text-rose-600 bg-rose-100'} px-2 py-1 rounded">${log.status}</span>
            </div>
            <div class="p-4 text-sm">
              <p class="text-slate-600 mb-2">${log.message}</p>
              ${log.logs && log.logs.length > 0 ? `
                <table class="w-full text-xs text-left mt-3">
                  <thead class="text-slate-400 border-b"><tr><th class="pb-1">抽出日付</th><th class="pb-1">抽出時間</th><th class="pb-1">結果</th></tr></thead>
                  <tbody class="divide-y divide-slate-100">
                    ${log.logs.map(l => `<tr><td class="py-1">${l.parsedDate}</td><td class="py-1">${l.time}</td><td>${l.status}</td></tr>`).join('')}
                  </tbody>
                </table>
              ` : ''}
            </div>
          </div>
        `;
      });

      content.innerHTML = html;
      document.getElementById('diagnosticModal').classList.replace('hidden', 'flex');
      lucide.createIcons();
    }

    function closeDiagnosticModal() {
      document.getElementById('diagnosticModal').classList.replace('flex', 'hidden');
    }

    window.onload = init;
  </script>
</body>
</html>
